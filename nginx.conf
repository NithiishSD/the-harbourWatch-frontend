server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker internal DNS resolver so dynamic upstreams don't crash startup
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Serve static assets directly
    location /static/ {
        alias /usr/share/nginx/html/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    # Server-Sent Events (SSE) alerts stream
    location = /api/alerts/stream {
        set $backend_target http://backend:8000;
        proxy_pass $backend_target;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }

    # REST API endpoints
    location /api/ {
        set $backend_target http://backend:8000;
        proxy_pass $backend_target;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Health check endpoint
    location = /health {
        set $backend_target http://backend:8000;
        proxy_pass $backend_target/health;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    # SPA fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
